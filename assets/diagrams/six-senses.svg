<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img" aria-labelledby="title desc">
  <title id="title">The six senses</title><desc id="desc">For each of the six faculties, an object and the corresponding consciousness meet to create contact.</desc>
  <defs><style>.h{font:700 30px 'Noto Sans',Arial,sans-serif;fill:#153f3c}.th{font:700 20px 'Noto Sans',Arial,sans-serif;fill:#fff}.t{font:19px 'Noto Sans',Arial,sans-serif;fill:#153f3c}.s{font:16px 'Noto Sans',Arial,sans-serif;fill:#35514f}.row{fill:#fff;stroke:#b8d3cd;stroke-width:1.5}</style></defs>
  <rect width="1200" height="710" rx="28" fill="#f7f2e7"/><text x="600" y="53" text-anchor="middle" class="h">The six senses</text><text x="600" y="84" text-anchor="middle" class="s">faculty + object + consciousness = contact</text>
  <g transform="translate(75 115)">
    <rect width="1050" height="54" rx="14" fill="#2c6d68"/><text x="130" y="35" text-anchor="middle" class="th">Faculty</text><text x="470" y="35" text-anchor="middle" class="th">Object</text><text x="830" y="35" text-anchor="middle" class="th">Consciousness</text>
    <g transform="translate(0 68)"><rect class="row" width="1050" height="70" rx="12"/><text x="130" y="43" text-anchor="middle" class="t">Eye</text><text x="470" y="43" text-anchor="middle" class="t">forms and colours</text><text x="830" y="43" text-anchor="middle" class="t">visual consciousness</text></g>
    <g transform="translate(0 146)"><rect class="row" width="1050" height="70" rx="12"/><text x="130" y="43" text-anchor="middle" class="t">Ear</text><text x="470" y="43" text-anchor="middle" class="t">sounds</text><text x="830" y="43" text-anchor="middle" class="t">auditory consciousness</text></g>
    <g transform="translate(0 224)"><rect class="row" width="1050" height="70" rx="12"/><text x="130" y="43" text-anchor="middle" class="t">Nose</text><text x="470" y="43" text-anchor="middle" class="t">odours</text><text x="830" y="43" text-anchor="middle" class="t">olfactory consciousness</text></g>
    <g transform="translate(0 302)"><rect class="row" width="1050" height="70" rx="12"/><text x="130" y="43" text-anchor="middle" class="t">Tongue</text><text x="470" y="43" text-anchor="middle" class="t">tastes</text><text x="830" y="43" text-anchor="middle" class="t">taste consciousness</text></g>
    <g transform="translate(0 380)"><rect class="row" width="1050" height="70" rx="12"/><text x="130" y="43" text-anchor="middle" class="t">Body</text><text x="470" y="43" text-anchor="middle" class="t">touch, pressure, temperature</text><text x="830" y="43" text-anchor="middle" class="t">tactile consciousness</text></g>
    <g transform="translate(0 458)"><rect class="row" width="1050" height="70" rx="12" fill="#eef8f5"/><text x="130" y="43" text-anchor="middle" class="t" font-weight="700">Mind</text><text x="470" y="33" text-anchor="middle" class="t">thoughts, memories, images</text><text x="470" y="56" text-anchor="middle" class="s">and other mental objects</text><text x="830" y="43" text-anchor="middle" class="t">mental consciousness</text></g>
  </g>
  <text x="600" y="680" text-anchor="middle" class="s">Together the six faculties, six objects and six consciousnesses are called the eighteen realms.</text>
</svg>

