<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">Ba chướng</title><desc id="desc">Phiền não tạo duyên cho nghiệp; nghiệp tạo duyên cho quả khổ; quả khổ lại có thể nuôi phiền não. Tu tập có thể ngắt vòng này.</desc>
  <defs><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#2c6d68" /></marker><style>.h{font:700 29px Arial,sans-serif;fill:#153f3c}.t{font:700 25px Arial,sans-serif;fill:#fff}.s{font:18px Arial,sans-serif;fill:#35514f}.w{font:17px Arial,sans-serif;fill:#fff}</style></defs>
  <rect width="1100" height="520" rx="28" fill="#f1f8f6" />
  <text x="550" y="55" text-anchor="middle" class="h">Ba chướng</text>
  <g fill="none" stroke="#2c6d68" stroke-width="5" marker-end="url(#a)"><path d="M365 160 C470 95 630 95 735 160" /><path d="M820 245 C850 320 770 390 670 405" /><path d="M430 405 C330 390 250 320 280 245" /></g>
  <circle cx="275" cy="190" r="105" fill="#a44f45" /><text x="275" y="180" text-anchor="middle" class="t">Phiền não</text><text x="275" y="213" text-anchor="middle" class="w">tham, sân,</text><text x="275" y="238" text-anchor="middle" class="w">si</text>
  <circle cx="825" cy="190" r="105" fill="#b7783e" /><text x="825" y="178" text-anchor="middle" class="t">Nghiệp</text><text x="825" y="211" text-anchor="middle" class="w">hành động có tác ý</text><text x="825" y="236" text-anchor="middle" class="w">qua thân, khẩu, ý</text>
  <circle cx="550" cy="405" r="105" fill="#526c8d" /><text x="550" y="395" text-anchor="middle" class="t">Quả báo</text><text x="550" y="428" text-anchor="middle" class="w">hệ quả và</text><text x="550" y="453" text-anchor="middle" class="w">các duyên tiếp nối</text>
  <rect x="405" y="185" width="290" height="104" rx="20" fill="#fff" stroke="#70a8a0" stroke-width="2" />
  <text x="550" y="217" text-anchor="middle" style="font:700 23px Arial,sans-serif;fill:#153f3c">Tu tập ngắt vòng</text>
  <text x="550" y="249" text-anchor="middle" style="font:16px Arial,sans-serif;fill:#35514f">chánh niệm • tự chế • sửa sai</text>
  <text x="550" y="274" text-anchor="middle" style="font:16px Arial,sans-serif;fill:#35514f">trí tuệ • các duyên lành</text>
</svg>