<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
  <title id="title">Sáu cõi và giải thoát</title><desc id="desc">Sáu cõi thuộc luân hồi. Niết-bàn là giải thoát khỏi vòng này, không phải cõi thứ bảy.</desc>
  <defs><style>.h{font:700 29px Arial,sans-serif;fill:#153f3c}.t{font:700 21px Arial,sans-serif;fill:#153f3c}.s{font:16px Arial,sans-serif;fill:#35514f}.w{font:700 23px Arial,sans-serif;fill:#fff}</style></defs>
  <rect width="1100" height="650" rx="28" fill="#eef8f5" /><text x="550" y="52" text-anchor="middle" class="h">Sáu cõi</text>
  <circle cx="465" cy="335" r="230" fill="none" stroke="#70a8a0" stroke-width="5" stroke-dasharray="10 9" />
  <circle cx="465" cy="335" r="92" fill="#153f3c" /><text x="465" y="328" text-anchor="middle" class="w">Luân hồi</text><text x="465" y="357" text-anchor="middle" class="s" style="fill:#dcefeb">tái sanh do duyên</text>
  <g fill="#fff" stroke="#70a8a0" stroke-width="2">
    <rect x="365" y="72" width="200" height="88" rx="18" /><rect x="612" y="165" width="200" height="88" rx="18" /><rect x="612" y="417" width="200" height="88" rx="18" />
    <rect x="365" y="510" width="200" height="88" rx="18" /><rect x="118" y="417" width="200" height="88" rx="18" /><rect x="118" y="165" width="200" height="88" rx="18" />
  </g>
  <text x="465" y="107" text-anchor="middle" class="t">Trời</text><text x="465" y="135" text-anchor="middle" class="s">vui sướng, dễ quên tu</text>
  <text x="712" y="200" text-anchor="middle" class="t">A-tu-la</text><text x="712" y="228" text-anchor="middle" class="s" style=";font-size:14.26px">quyền lực, đố kỵ, tranh chấp</text>
  <text x="712" y="452" text-anchor="middle" class="t">Người</text><text x="712" y="480" text-anchor="middle" class="s">lựa chọn và cơ hội</text>
  <text x="465" y="545" text-anchor="middle" class="t">Súc sanh</text><text x="465" y="573" text-anchor="middle" class="s">sợ hãi, ít tự do</text>
  <text x="218" y="452" text-anchor="middle" class="t">Ngạ quỷ</text><text x="218" y="480" text-anchor="middle" class="s">thèm muốn khôn nguôi</text>
  <text x="218" y="200" text-anchor="middle" class="t">Địa ngục</text><text x="218" y="228" text-anchor="middle" class="s">khổ đau dữ dội</text>
  <path d="M706 338 C800 338 824 338 872 338" stroke="#b7783e" stroke-width="5" fill="none" /><path d="M862 326 L884 338 L862 350Z" fill="#b7783e" />
  <rect x="870" y="270" width="185" height="140" rx="24" fill="#b7783e" /><text x="962" y="315" text-anchor="middle" class="w">Niết-bàn</text><text x="962" y="348" text-anchor="middle" class="s" style="fill:#fff">giải thoát khỏi</text><text x="962" y="374" text-anchor="middle" class="s" style="fill:#fff">luân hồi, không là</text><text x="962" y="400" text-anchor="middle" class="s" style="fill:#fff">cõi thứ bảy</text>
  <text x="550" y="630" text-anchor="middle" class="s">Có thể hiểu các cõi theo vũ trụ quan, đồng thời như những dạng kinh nghiệm sống.</text>
</svg>